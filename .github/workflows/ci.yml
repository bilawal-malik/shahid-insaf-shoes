name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Lint (0 warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build storefront
        run: npm run build

      # Smoke tests are intentionally not run here: they need a live, seeded
      # MongoDB + API (npm run seed / npm run dev). Run them locally before
      # release: npm run smoke -w apps/api
